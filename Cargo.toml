[workspace]
members = [
    "crates/hearth-core",
    "crates/hearth-script",
    "crates/hearth-cli",
    "crates/hearth-bot",
    "crates/hearth-env",
    "crates/hearth-env-py",
    "crates/hearth-fuzz",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
mlua = { version = "0.11", features = ["lua54", "vendored"] }
rand = "0.9"
rand_chacha = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
